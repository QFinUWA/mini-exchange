# QFin mini exchange on the QFin VPS (/opt/mini-exchange).
# Joins the vps-infra network so Caddy can route exchange.qfinuwa.org:
#   /api/*, /ws -> exchange-server:3211, everything else -> exchange-web:3000
# Images are built off the VPS and loaded with deploy.sh (the VPS is too small to build Next.js).
name: mini-exchange

services:
  exchange-server:
    image: qfin-mini-exchange-server:latest
    container_name: exchange-server
    restart: unless-stopped
    volumes:
      - exchange-data:/data
      - bot-jobs:/data/bots
    networks: [web]
    mem_limit: 300m

  # Backtests uploaded bots, one at a time. No network at all; it only shares the bot-jobs
  # volume with the server. Capped so the live exchange keeps most of the 1 CPU VPS.
  exchange-runner:
    image: qfin-mini-exchange-runner:latest
    container_name: exchange-runner
    restart: unless-stopped
    network_mode: none
    volumes:
      - bot-jobs:/jobs
    tmpfs:
      - /work:size=100m,mode=0711
      - /tmp:size=50m,mode=0755
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 0.7
    mem_limit: 450m

  exchange-web:
    image: qfin-mini-exchange-web:latest
    container_name: exchange-web
    restart: unless-stopped
    depends_on: [exchange-server]
    networks: [web]
    mem_limit: 200m

networks:
  web:
    name: infra_web
    external: true

volumes:
  exchange-data:
  bot-jobs:
